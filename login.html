<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Hambúrguer do Arraso</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="topbar-mount"></div>

<div class="auth-shell">
  <div class="auth-card burn-edge">
    <h2 class="font-display">Entrar na tua conta</h2>
    <p class="sub">Acompanha as tuas encomendas e guarda os teus dados.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" required placeholder="oteu@email.com">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" required placeholder="••••••••">
      </div>
      <p id="login-error" class="error-msg" style="display:none;"></p>
      <button type="submit" class="btn-orange block" id="login-btn">Entrar</button>
    </form>

    <p class="auth-switch">Ainda não tens conta? <a href="registo.html">Cria uma agora</a></p>
  </div>
</div>

<script src="assets/supabase-config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/cart.js"></script>
<script src="assets/layout.js"></script>
<script>
renderTopbar();

// Se já estiver autenticado, avança logo
getSession().then(session => {
  if(session){
    const next = new URLSearchParams(window.location.search).get('next') || 'conta.html';
    window.location.href = next;
  }
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'A entrar…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if(error){
    errEl.textContent = 'E-mail ou senha incorretos.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }

  const next = new URLSearchParams(window.location.search).get('next') || 'conta.html';
  window.location.href = next;
});
</script>
</body>
</html>
