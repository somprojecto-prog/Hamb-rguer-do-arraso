<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Hambúrguer do Arraso</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-burger-wrap">
    <img src="assets/img/loading-burger.png" alt="A carregar…">
  </div>
  <p>A carregar…</p>
</div>

<div id="topbar-mount"></div>

<div class="auth-shell">
  <div class="auth-card burn-edge">
    <h2 class="font-display">Entrar na tua conta</h2>
    <p class="sub">Acompanha as tuas encomendas e guarda os teus dados.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" required placeholder="oteu@email.com">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" required placeholder="••••••••">
      </div>
      <p id="login-error" class="error-msg" style="display:none;"></p>
      <button type="submit" class="btn-orange block" id="login-btn">Entrar</button>
    </form>

    <div class="divider-or">ou</div>
    <button onclick="entrarComGoogle()" class="btn-outline block" style="display:flex;align-items:center;justify-content:center;gap:.6rem;">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.6 0-14.2 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.1 27 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.7 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.5 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continuar com o Google
    </button>

    <p class="auth-switch">Ainda não tens conta? <a href="registo.html">Cria uma agora</a></p>
  </div>
</div>

<div id="bottom-nav-mount"></div>

<script src="assets/supabase-config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/cart.js"></script>
<script src="assets/layout.js"></script>
<script>
renderTopbar();
renderBottomNav();

async function entrarComGoogle(){
  await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname.replace('login.html','conta.html') }
  });
}

// Se já estiver autenticado, avança logo
getSession().then(session => {
  if(session){
    const next = new URLSearchParams(window.location.search).get('next') || 'conta.html';
    window.location.href = next;
  }
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'A entrar…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if(error){
    errEl.textContent = 'E-mail ou senha incorretos.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }

  const next = new URLSearchParams(window.location.search).get('next') || 'conta.html';
  window.location.href = next;
});
</script>
</body>
</html>
