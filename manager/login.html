<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Gestor — Hambúrguer do Arraso</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="charcoal-texture">

<div class="auth-shell">
  <div class="auth-card burn-edge">
    <div style="display:flex;align-items:center;gap:.7rem;margin-bottom:1.2rem;">
      <div class="logo-placeholder">HA</div>
      <div>
        <h2 class="font-display" style="font-size:1.1rem;">Painel do Gestor</h2>
        <p style="font-size:.75rem;color:var(--orange-light);text-transform:uppercase;letter-spacing:.1em;">Área restrita</p>
      </div>
    </div>
    <p class="sub">Acesso exclusivo à administração do site.</p>

    <form id="admin-login-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" required autocomplete="current-password">
      </div>
      <p id="login-error" class="error-msg" style="display:none;"></p>
      <button type="submit" class="btn-orange block" id="login-btn">Entrar</button>
    </form>

    <p class="auth-switch"><a href="../index.html">← Voltar ao site</a></p>
  </div>
</div>

<script src="../assets/supabase-config.js"></script>
<script src="../assets/common.js"></script>
<script>
getSession().then(async (session) => {
  if(session){
    const profile = await getProfile(session.user.id);
    if(profile && ['admin','gestor','funcionario'].includes(profile.role)) window.location.href = 'index.html';
  }
});

document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'A entrar…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    errEl.textContent = 'E-mail ou senha incorretos.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }

  const profile = await getProfile(data.user.id);
  if(!profile || !['admin','gestor','funcionario'].includes(profile.role)){
    await supabaseClient.auth.signOut();
    errEl.textContent = 'Esta conta não tem permissões de administrador.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }

  window.location.href = 'index.html';
});
</script>
</body>
</html>
