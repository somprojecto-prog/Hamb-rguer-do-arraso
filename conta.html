<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A minha conta — Hambúrguer do Arraso</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="topbar-mount"></div>

<main class="wrap">
  <div class="account-layout">
    <div class="account-tabs">
      <button data-tab="perfil" onclick="mudarTab('perfil')" class="active">👤 Perfil</button>
      <button data-tab="encomendas" onclick="mudarTab('encomendas')">📦 As minhas encomendas</button>
      <button data-tab="favoritos" onclick="mudarTab('favoritos')">❤️ Favoritos</button>
      <button onclick="logout()" style="color:#ffb4b4;margin-top:1rem;">Sair da conta</button>
    </div>
    <div class="account-content">
      <div id="view-perfil"></div>
      <div id="view-encomendas" style="display:none;"></div>
      <div id="view-favoritos" style="display:none;"></div>
    </div>
  </div>
</main>

<div id="bottom-nav-mount"></div>

<script src="assets/supabase-config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/cart.js"></script>
<script src="assets/layout.js"></script>
<script>
renderTopbar();
renderBottomNav();
let sessao = null, perfil = null;

function mudarTab(tab){
  document.querySelectorAll('.account-tabs button[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('view-perfil').style.display = tab === 'perfil' ? 'block' : 'none';
  document.getElementById('view-encomendas').style.display = tab === 'encomendas' ? 'block' : 'none';
  document.getElementById('view-favoritos').style.display = tab === 'favoritos' ? 'block' : 'none';
  if(tab === 'encomendas') carregarEncomendas();
  if(tab === 'favoritos') carregarFavoritos();
}

function renderPerfil(){
  document.getElementById('view-perfil').innerHTML = `
    <h2 style="font-size:1.4rem;margin-bottom:1.2rem;">Os meus dados</h2>
    <div class="admin-card" style="max-width:460px;">
      <form id="perfil-form">
        <div class="field"><label>Nome</label><input id="p-nome" type="text" value="${perfil.nome || ''}"></div>
        <div class="field"><label>E-mail</label><input type="email" value="${sessao.user.email}" disabled style="opacity:.6;"></div>
        <div class="field"><label>Telefone</label><input id="p-telefone" type="tel" value="${perfil.telefone || ''}"></div>
        <div class="field"><label>Morada</label><input id="p-morada" type="text" value="${perfil.morada || ''}"></div>
        <button type="submit" class="btn-orange">Guardar alterações</button>
        <span id="perfil-status" style="margin-left:.8rem;font-size:.85rem;color:#8bd18f;"></span>
      </form>
    </div>
  `;
  document.getElementById('perfil-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const updates = {
      nome: document.getElementById('p-nome').value.trim(),
      telefone: document.getElementById('p-telefone').value.trim(),
      morada: document.getElementById('p-morada').value.trim()
    };
    const { error } = await supabaseClient.from('profiles').update(updates).eq('id', sessao.user.id);
    document.getElementById('perfil-status').textContent = error ? 'Erro ao guardar.' : 'Guardado!';
    if(!error) Object.assign(perfil, updates);
  });
}

async function carregarEncomendas(){
  const box = document.getElementById('view-encomendas');
  box.innerHTML = `<div class="empty-state"><span class="spinner"></span></div>`;
  const { data, error } = await supabaseClient
    .from('orders')
    .select('*, order_items(*)')
    .order('created_at', { ascending:false });
  if(error || !data.length){
    box.innerHTML = `<div class="empty-state"><div class="icon">📦</div><p>Ainda não fizeste nenhuma encomenda.</p><a href="loja.html" class="btn-orange" style="margin-top:1rem;">Ver menu</a></div>`;
    return;
  }
  box.innerHTML = `<h2 style="font-size:1.4rem;margin-bottom:1.2rem;">As minhas encomendas</h2>` + data.map(o => `
    <div class="order-card">
      <div class="order-card-head">
        <div>
          <p style="font-weight:700;">${new Date(o.created_at).toLocaleString('pt-PT')}</p>
          <p style="font-size:.85rem;color:rgba(241,231,218,0.55);">${o.order_items.length} item(ns)</p>
        </div>
        <span class="status-pill status-${o.status.replace(' ','-')}">${o.status}</span>
      </div>
      ${o.order_items.map(i => `<p style="font-size:.85rem;color:rgba(241,231,218,0.7);">${i.quantidade}x ${i.nome}</p>`).join('')}
      <p style="font-weight:800;margin-top:.6rem;color:var(--orange-light);">${formatKz(o.total)}</p>
    </div>
  `).join('');
}

async function carregarFavoritos(){
  const box = document.getElementById('view-favoritos');
  box.innerHTML = `<div class="empty-state"><span class="spinner"></span></div>`;
  const { data, error } = await supabaseClient
    .from('favorites')
    .select('produto_id, products(*)');
  if(error || !data.length){
    box.innerHTML = `<div class="empty-state"><div class="icon">❤️</div><p>Ainda não tens favoritos.</p><a href="loja.html" class="btn-orange" style="margin-top:1rem;">Ver menu</a></div>`;
    return;
  }
  box.innerHTML = `<h2 style="font-size:1.4rem;margin-bottom:1.2rem;">Os meus favoritos</h2>
    <div class="fav-grid">` + data.filter(f => f.products).map(f => `
    <a href="loja.html?produto=${f.products.id}" class="product-card burn-edge card-hover">
      <div class="product-img" style="${f.products.imagem_url ? `background-image:url(${f.products.imagem_url})` : ''}">${f.products.imagem_url ? '' : 'Sem foto'}</div>
      <div class="info"><h4>${f.products.nome}</h4><p class="price">${formatKz(f.products.preco)}</p></div>
    </a>
  `).join('') + `</div>`;
}

async function init(){
  const auth = await requireLogin('login.html?next=conta.html');
  if(!auth) return;
  sessao = auth.session; perfil = auth.profile;
  renderPerfil();
  const tab = new URLSearchParams(window.location.search).get('tab');
  if(tab) mudarTab(tab);
}
init();
</script>
</body>
</html>
