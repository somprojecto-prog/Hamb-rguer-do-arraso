<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar mesa — Hambúrguer do Arraso</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-burger-wrap">
    <img src="assets/loading-burger.png" alt="A carregar…">
  </div>
  <p>A carregar…</p>
</div>

<div id="topbar-mount"></div>

<main class="wrap-sm" style="padding:2.5rem 0 3rem;">
  <p class="section-eyebrow">RESERVAS</p>
  <h1 class="font-display" style="font-size:1.8rem;margin-bottom:.8rem;">Reserve a sua mesa</h1>
  <p style="color:rgba(241,231,218,0.65);margin-bottom:1.5rem;">
    Desfrute dos nossos hambúrgueres e pratos no conforto do nosso restaurante. Reserve a sua mesa com antecedência e venha viver a experiência do Hambúrguer do Arraso com amigos e família.
  </p>

  <div class="product-img burn-edge" style="height:180px;margin-bottom:1.5rem;">[ Imagem do restaurante — placeholder ]</div>

  <div id="reserva-content"></div>
</main>

<div id="bottom-nav-mount"></div>

<script src="assets/supabase-config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/cart.js"></script>
<script src="assets/layout.js"></script>
<script>
renderTopbar('reservas');
renderBottomNav('reservas');

async function init(){
  const auth = await requireLogin('login.html?next=reservas.html', 'Inicia sessão para reservares a tua mesa');
  if(!auth) return;
  const perfil = auth.profile;

  document.getElementById('reserva-content').innerHTML = `
    <form id="reserva-form" class="admin-card">
      <div class="field"><label>Nome completo *</label><input id="r-nome" type="text" required placeholder="O seu nome" value="${perfil.nome || ''}"></div>
      <div style="display:flex;gap:1rem;">
        <div class="field" style="flex:1;"><label>Número de telefone *</label><input id="r-telefone" type="tel" required placeholder="9XX XXX XXX" value="${perfil.telefone || ''}"></div>
        <div class="field" style="flex:1;"><label>E-mail (opcional)</label><input id="r-email" type="email" placeholder="seuemail@exemplo.com" value="${auth.session.user.email}"></div>
      </div>
      <div style="display:flex;gap:1rem;">
        <div class="field" style="flex:1;"><label>Data da reserva *</label><input id="r-data" type="date" required></div>
        <div class="field" style="flex:1;"><label>Hora da reserva *</label><input id="r-hora" type="time" required></div>
      </div>
      <div style="display:flex;gap:1rem;">
        <div class="field" style="flex:1;"><label>Número de pessoas *</label><input id="r-pessoas" type="number" min="1" placeholder="Ex: 4" value="2" required></div>
        <div class="field" style="flex:1;">
          <label>Tipo de mesa *</label>
          <select id="r-tipo" required>
            <option value="">Selecione</option>
            <option>Interior</option>
            <option>Esplanada</option>
            <option>Reservado (privado)</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Observações (opcional)</label><textarea id="r-obs" rows="3" placeholder="Alguma preferência ou pedido especial?"></textarea></div>

      <label style="display:flex;align-items:flex-start;gap:.6rem;font-size:.82rem;color:rgba(241,231,218,0.65);margin-bottom:1.2rem;">
        <input id="r-termos" type="checkbox" required style="width:auto;margin-top:.2rem;">
        Li e aceito a política de cancelamento, a tolerância de atraso de 15 minutos e confirmo que os dados fornecidos são verdadeiros. *
      </label>

      <p id="reserva-error" class="error-msg" style="display:none;"></p>
      <button type="submit" class="btn-orange block" id="reserva-btn">Reservar Mesa</button>
    </form>
  `;

  document.getElementById('reserva-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('reserva-btn');
    btn.disabled = true; btn.textContent = 'A enviar…';

    const reserva = {
      cliente_id: auth.session.user.id,
      nome: document.getElementById('r-nome').value.trim(),
      telefone: document.getElementById('r-telefone').value.trim(),
      email: document.getElementById('r-email').value.trim(),
      data_reserva: document.getElementById('r-data').value,
      hora_reserva: document.getElementById('r-hora').value,
      pessoas: Number(document.getElementById('r-pessoas').value),
      tipo_mesa: document.getElementById('r-tipo').value,
      observacoes: document.getElementById('r-obs').value.trim()
    };

    const { error } = await supabaseClient.from('reservations').insert(reserva);

    if(error){
      document.getElementById('reserva-error').textContent = 'Não foi possível enviar a reserva.';
      document.getElementById('reserva-error').style.display = 'block';
      btn.disabled = false; btn.textContent = 'Reservar Mesa';
      return;
    }

    // A reserva já ficou gravada — abre o WhatsApp com o resumo, para o
    // restaurante confirmar contigo diretamente.
    const mensagem =
      `Olá! Gostaria de reservar uma mesa no Hambúrguer do Arraso:\n\n` +
      `Nome: ${reserva.nome}\nTelefone: ${reserva.telefone}\n` +
      (reserva.email ? `E-mail: ${reserva.email}\n` : '') +
      `Data: ${reserva.data_reserva}\nHora: ${reserva.hora_reserva}\n` +
      `Pessoas: ${reserva.pessoas}\nTipo de mesa: ${reserva.tipo_mesa}\n` +
      (reserva.observacoes ? `Observações: ${reserva.observacoes}\n` : '');
    sendWhatsAppMessage(mensagem);

    document.getElementById('reserva-content').innerHTML = `
      <div class="empty-state">
        <div class="icon">✅</div>
        <h3 class="font-display" style="font-size:1.3rem;margin-bottom:.5rem;">Reserva enviada!</h3>
        <p>Vamos confirmar contigo brevemente. Se o WhatsApp não abriu sozinho, toca no botão flutuante para falares connosco.</p>
      </div>`;
  });
}
init();
</script>
</body>
</html>
